[build-system]
# 安装即用：`pip install .` 即可得到 `qforge` 命令（AGENTS.md 产品形态要求）
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qforge"
version = "0.1.0"
description = "QForge — ONNX 自动化量化部署平台（SPEC.md V1.0）"
readme = "README.md"
# SPEC 4.1：版本矩阵必须固定。项目统一使用 Python 3.10（conda env: qforge）。
requires-python = ">=3.10,<3.11"
# 依赖边界（决定容器镜像有多大）：
#   dependencies = 核心：Web/队列/校验/预处理/代码生成 —— **不需要 GPU**，api 容器只装这些；
#   gpu 额外项   = TensorRT 运行库 + cuda-python —— 构建 Engine 与 INT8 校准需要，worker 容器装它。
# 原生安装由 scripts/install.ps1 自动执行 `pip install ".[gpu]"`（用户不需要记这些）。
dependencies = [
    # ---- Web / 数据库 / 队列 ----
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.0.54",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "celery==5.6.3",
    "redis==8.1.0",
    # ---- 模型校验 / 预处理 / 代码生成 / 上传 ----
    "onnx==1.23.1",
    "onnxruntime==1.23.2",
    "numpy==2.2.6",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.3.0",
    "Jinja2==3.1.6",
    "PyYAML==6.0.3",
    "python-multipart==0.0.32",
    "psutil==7.2.2",
    # ---- 本地构建链（编译生成的 C++ 工程需要；体积小，不单独拆）----
    "cmake==4.4.3",
    "ninja==1.13.2",
]

[project.optional-dependencies]
# GPU：TensorRT 运行库由 pip 提供，**无需登录 NVIDIA 账号**（Linux 版单包约 3.7 GB，
# 这也是 api 镜像与 worker 镜像分开的原因）。仅「编译生成的 C++ 工程」才需要官方开发包。
gpu = ["tensorrt==10.16.1.11", "cuda-python==13.4.1"]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
qforge = "app.cli:main"

[tool.setuptools.packages.find]
# backend/ 提供 app 包，仓库根提供 workers 包（SPEC 附录 A 目录结构）
where = ["backend", "."]
include = ["app*", "workers*"]

[tool.setuptools.package-data]
# 代码生成模板与数据库迁移必须随包分发，否则安装后无法生成工程 / 无法升级表结构
app = ["codegen/templates/**/*.j2", "migrations/**/*"]

[tool.pytest.ini_options]
# backend/ 提供 `app` 包，仓库根提供 `workers` 包（SPEC 附录 A 目录结构）
pythonpath = ["backend", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not gpu and not cpp and not docker'"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "slow: 需要外部服务或耗时较长的用例",
    "gpu: 需要 NVIDIA GPU + TensorRT，会真实构建 Engine 并推理（默认跳过）",
    "cpp: 需要 TensorRT/CUDA 开发文件与 MSVC 工具链，会真实编译并运行生成的工程（默认跳过）",
    "docker: 需要 Docker daemon 与 TensorRT 基础镜像，会真实构建并运行容器镜像（默认跳过）",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["backend", "workers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
