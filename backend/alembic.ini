# Alembic configuration (SPEC 14.1: schema changes go through migrations)
#
# Usage (from the repository root):
#   alembic -c backend/alembic.ini revision --autogenerate -m "description"
#   alembic -c backend/alembic.ini upgrade head
#
# The database URL is NOT set here: migrations/env.py reads it from the
# application settings (QFORGE_DATABASE_URL; defaults to storage/qforge.db).
#
# IMPORTANT: keep this file ASCII-only. Alembic reads it with the OS locale
# encoding (GBK on this machine), so non-ASCII comments break config parsing.

[alembic]
# Migration scripts live inside the package (app/migrations) so that an installed
# app can apply them without the repository's ini file (see `qforge init`).
script_location = %(here)s/app/migrations
prepend_sys_path = %(here)s
sqlalchemy.url =
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
