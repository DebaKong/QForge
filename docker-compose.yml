# QForge 容器编排（可选部署方式）
#
# 两种用法：
#   1) 只要 Redis（本机原生安装的应用连它）：
#        docker compose up -d redis
#   2) 完整容器化（api + worker + redis）：
#        docker compose up -d --build
#      然后打开 http://127.0.0.1:8000
#
# 已验证 / 未验证（诚实标注）：
#   - redis 服务：本机已实测（Redis 7.4.11，PING 正常）
#   - api / worker：见 docs/docker.md 的验证记录
#   - postgres 服务：属于阶段 1 之后的候选，未接入应用，用 profile 隔离（默认不启动）
#
# GPU：worker 需要显卡来构建 Engine，已声明 NVIDIA 设备预留；
#      若本机 Docker 未启用 GPU 支持，可先只跑 api，或改用原生安装（README「快速开始」）。

name: qforge

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        # 可用环境变量覆盖为国内镜像（.env 里设 QFORGE_PIP_INDEX_URL）
        PIP_INDEX_URL: ${QFORGE_PIP_INDEX_URL:-https://pypi.org/simple}
    image: qforge-api:latest
    depends_on:
      redis:
        condition: service_healthy
    environment:
      QFORGE_ENVIRONMENT: prod
      QFORGE_DATA_DIR: /data/storage
      QFORGE_FRONTEND_DIR: /opt/qforge/web
      QFORGE_EXECUTOR_MODE: celery
      QFORGE_CELERY_TASK_ALWAYS_EAGER: "false"
      QFORGE_CELERY_BROKER_URL: redis://redis:6379/0
      QFORGE_CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - qforge-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    image: qforge-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        PIP_INDEX_URL: ${QFORGE_PIP_INDEX_URL:-https://pypi.org/simple}
    command: ["qforge", "worker", "--concurrency", "1"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      QFORGE_ENVIRONMENT: prod
      QFORGE_DATA_DIR: /data/storage
      QFORGE_FRONTEND_DIR: /opt/qforge/web
      QFORGE_EXECUTOR_MODE: celery
      QFORGE_CELERY_TASK_ALWAYS_EAGER: "false"
      QFORGE_CELERY_BROKER_URL: redis://redis:6379/0
      QFORGE_CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - qforge-data:/data
    # 构建 Engine 需要显卡；没有 NVIDIA 运行时的机器可注释掉这段，只跑 api
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # 未接入应用，默认不启动：docker compose --profile postgres up -d postgres
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: qforge
      POSTGRES_PASSWORD: qforge
      POSTGRES_DB: qforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qforge -d qforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  qforge-data:
